<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#12171f" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="./icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="./icon.svg" />
    <title>Endless Road Trip — v0.1</title>
  </head>
  <body>
    <div id="scene"></div>

    <!-- Debug/testing overlay only. Not a real UI yet. -->
    <div id="hud" aria-hidden="true">
      <div class="hud-row">
        <span class="hud-dot" id="hud-dot"></span>
        <span class="hud-mood" id="hud-mood">—</span>
      </div>
      <div class="hud-bar"><div class="hud-bar-fill" id="hud-bar"></div></div>
      <div class="hud-meta">
        <span id="hud-song">song 0/0</span>
        <span id="hud-miles">0.0 mi</span>
      </div>
      <div class="hud-env">
        <span id="hud-terrain">—</span>
        <span class="hud-sep">·</span>
        <span id="hud-climate">—</span>
      </div>
      <div class="hud-event" id="hud-event"></div>
    </div>

    <div id="flash" aria-hidden="true"></div>
    <div id="screens"></div>
    <div id="hint" data-touch="drag to steer" data-keys="arrow keys / a-d &middot; drag to steer">arrow keys / a-d &middot; drag to steer</div>
    <div id="stick" aria-hidden="true"><i></i><b></b></div>
    <button id="tilt-btn" type="button" hidden>enable tilt steering</button>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
